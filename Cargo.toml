[package]
name = "platinum-engine"
version = "0.1.0"
license = "0BSD"
edition = "2024"
rust-version = "1.99"
publish = false
autobins = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "platinum"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
libloading = "0.8"
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
