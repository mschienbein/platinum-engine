[package]
name = "platinum-engine"
version = "0.3.0"
license = "MIT"
edition = "2024"
rust-version = "1.99"
publish = false
autobins = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "platinum"
path = "src/main.rs"

[features]
# Use the portable replacements for Apple system components on macOS too, so
# their outputs can be verified against the macOS reference builds.
portable = []

[lints.clippy]
disallowed_methods = "deny"

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
libc = "0.2.191"
libloading = "0.8"
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
